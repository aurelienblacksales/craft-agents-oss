# Nginx config for Craft Agent web client
# Serves static files and proxies /ws to the server service

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket proxy to the server service
    # On Railway, use the internal service URL (e.g., craft-agent-server.railway.internal:9100)
    # Configure via CRAFT_SERVER_INTERNAL_URL env var in Railway dashboard
    location /ws {
        proxy_pass http://${CRAFT_SERVER_HOST:-craft-agent-server}:${CRAFT_SERVER_PORT:-9100};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
