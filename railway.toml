# Railway deployment configuration
# Deploy as two services: server + web client
#
# Setup instructions:
# 1. Create a new Railway project
# 2. Add two services from this repo
# 3. Service 1 (server): Set Dockerfile path to Dockerfile.server
#    - Add volume at /data/craft-agent
#    - Set env vars: CRAFT_SERVER_TOKEN, ANTHROPIC_API_KEY
# 4. Service 2 (web): Set Dockerfile path to Dockerfile.web
#    - Set env var: CRAFT_SERVER_HOST=<server-service-name>.railway.internal
#
# Railway auto-provides HTTPS/WSS at the edge (no TLS config needed).

[build]
# Railway will detect Dockerfile automatically
# Use the Railway dashboard to select which Dockerfile per service

[deploy]
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
