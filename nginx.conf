server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # WebSocket proxy to server
    location /ws {
        # Dynamic DNS resolver for Railway internal networking (IPv6)
        resolver ${RESOLVER} valid=10s;
        set $ws_upstream http://${SERVER_HOST}:${SERVER_PORT};
        proxy_pass $ws_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Health endpoint proxy
    location /health {
        resolver ${RESOLVER} valid=10s;
        set $health_upstream http://${SERVER_HOST}:${SERVER_PORT};
        proxy_pass $health_upstream/health;
    }

    # OAuth callback proxy (server-side OAuth redirect handler)
    location /oauth/callback {
        resolver ${RESOLVER} valid=10s;
        set $oauth_upstream http://${SERVER_HOST}:${SERVER_PORT};
        proxy_pass $oauth_upstream/oauth/callback;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # File upload proxy
    location /upload {
        resolver ${RESOLVER} valid=10s;
        set $upload_upstream http://${SERVER_HOST}:${SERVER_PORT};
        proxy_pass $upload_upstream/upload;
        proxy_set_header Host $host;
        client_max_body_size 50M;
    }

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
